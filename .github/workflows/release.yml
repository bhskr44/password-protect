name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  NODE_VERSION: 26.11.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test
      - run: npm run test:app

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: pwsh scripts/build-windows.ps1
      - run: node scripts/cross-check.mjs lock dist/PasswordProtect.exe cross windows
      - run: npm run build:win
      - name: Test the built app
        run: npm run test:app
        env:
          PACKAGED_APP: release/win-unpacked/Password Protect.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/PasswordProtect-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: dist/PasswordProtect.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sample-windows
          path: cross/windows.*
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build:cli
      - run: node scripts/cross-check.mjs lock dist/protect cross macos
      - run: npm run build:mac
      - name: Test the built app
        run: npm run test:app
        env:
          PACKAGED_APP: release/mac-arm64/Password Protect.app/Contents/MacOS/Password Protect
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: program-macos
          path: dist/protect
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sample-macos
          path: cross/macos.*
          if-no-files-found: error

  # Each OS's build must open what the other OS's build locked.
  mac-to-windows:
    needs: [windows, macos]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sample-macos
          path: cross
      - run: node scripts/cross-check.mjs unlock dist/PasswordProtect.exe cross macos

  windows-to-mac:
    needs: [windows, macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: program-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sample-windows
          path: cross
      - run: chmod +x dist/protect
      - run: node scripts/cross-check.mjs unlock dist/protect cross windows

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac-to-windows, windows-to-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: cli-windows
          path: cli
      - uses: actions/download-artifact@v4
        with:
          name: program-macos
          path: cli
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mv cli/PasswordProtect.exe "artifacts/command-line-only-$VERSION-windows-x64.exe"
          mv cli/protect "artifacts/command-line-only-$VERSION-macos-arm64"
          gh release create "$TAG" artifacts/* --title "Password Protect $VERSION" --notes-file RELEASE_NOTES.md
